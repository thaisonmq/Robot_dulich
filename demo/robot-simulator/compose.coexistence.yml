name: rovera-robot-edge

# Read-only integration for a Pi that is still running the vendor Yahboom
# joystick and the guarded legacy micro-ROS Agent. This file deliberately has
# no service that opens /dev/ttyUSB0. Web motion stays disabled by default,
# but an explicitly configured managed bridge may enable the ROS 2 backend.
services:
  robot-simulator:
    environment:
      MOTION_BACKEND: ${MOTION_BACKEND:-disabled}
      NAVIGATION_BACKEND: ros2

  mapping-stack:
    profiles: ["legacy-coexistence"]
    build:
      context: ./navigation-stack
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 10s
    user: "${ROBOT_UID:-1000}:${ROBOT_GID:-1000}"
    environment:
      HOME: /tmp/rovera-mapping
      ROS_LOG_DIR: /tmp/rovera-mapping/ros-log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-20}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # The vendor/micro-ROS graph runs as root while this service runs as
      # ROBOT_UID. UDP-only avoids cross-UID Fast DDS SHM corruption while
      # preserving multicast discovery for RViz on the LAN.
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/micro_ros_fastdds.xml
      ROBOT_ID: ${ROBOT_ID:-ROBOT-001}
      NAVIGATION_MODE: MAPPING
      # Coexistence always reuses Yahboom's EKF/robot_state_publisher. Starting
      # a second base runtime creates duplicate TF authorities and corrupts
      # SLAM sensor discovery.
      ROVERA_USE_VENDOR_BASE_RUNTIME: "1"
      NAVIGATION_SOCKET_PATH: /var/lib/rovera/navigation/navigation.sock
      NAVIGATION_SOCKET_GID: ${ROBOT_GID:-1000}
      ROVERA_MAP_ROOT: /var/lib/rovera/maps
      REQUIRE_SENSOR_HEALTH: ${REQUIRE_SENSOR_HEALTH:-1}
    volumes:
      - type: bind
        source: ${ROBOT_STATE_DIR:-./state}
        target: /var/lib/rovera
      - type: bind
        source: ./micro_ros_fastdds.xml
        target: /etc/rovera/micro_ros_fastdds.xml
        read_only: true
    healthcheck:
      test: ["CMD", "/opt/rovera/scripts/healthcheck.sh"]
      interval: 8s
      timeout: 5s
      retries: 10
      start_period: 25s
    mem_limit: 1500m
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
