name: rovera-robot-edge

# Read-only integration for a Pi that is still running the vendor Yahboom
# joystick and the guarded legacy micro-ROS Agent. This file deliberately has
# no service that opens /dev/ttyUSB0. Web motion stays disabled by default,
# but an explicitly configured managed bridge may enable the ROS 2 backend.
services:
  robot-simulator:
    environment:
      MOTION_BACKEND: ${MOTION_BACKEND:-disabled}
      NAVIGATION_BACKEND: ros2

  mapping-stack:
    profiles: ["legacy-coexistence"]
    image: ${ROVERA_MAPPING_IMAGE:-rovera-robot-edge-mapping-stack}
    build:
      context: ./navigation-stack
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 10s
    user: "${ROBOT_UID:-1000}:${ROBOT_GID:-1000}"
    environment:
      HOME: /tmp/rovera-mapping
      ROS_LOG_DIR: /tmp/rovera-mapping/ros-log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-20}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # The vendor/micro-ROS graph runs as root while this service runs as
      # ROBOT_UID. UDP-only avoids cross-UID Fast DDS SHM corruption while
      # preserving multicast discovery for RViz on the LAN.
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/micro_ros_fastdds.xml
      ROBOT_ID: ${ROBOT_ID:-ROBOT-001}
      NAVIGATION_MODE: MAPPING
      # Coexistence always reuses Yahboom's EKF/robot_state_publisher. Starting
      # a second base runtime creates duplicate TF authorities and corrupts
      # SLAM sensor discovery.
      ROVERA_USE_VENDOR_BASE_RUNTIME: "1"
      NAVIGATION_SOCKET_PATH: /var/lib/rovera/navigation/navigation.sock
      NAVIGATION_SOCKET_GID: ${ROBOT_GID:-1000}
      ROVERA_MAP_ROOT: /var/lib/rovera/maps
      REQUIRE_SENSOR_HEALTH: ${REQUIRE_SENSOR_HEALTH:-1}
    volumes:
      - type: bind
        source: ${ROBOT_STATE_DIR:-./state}
        target: /var/lib/rovera
      - type: bind
        source: ./micro_ros_fastdds.xml
        target: /etc/rovera/micro_ros_fastdds.xml
        read_only: true
      # Mapping calibration is deployed independently of the large ROS image.
      # The next mapping container picks it up without rebuilding on the Pi.
      - type: bind
        source: ./navigation-stack/config/slam_toolbox.yaml
        target: /opt/rovera/config/slam_toolbox.yaml
        read_only: true
      - type: bind
        source: ./navigation-stack/config/sensor_time.yaml
        target: /opt/rovera/config/sensor_time.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "/opt/rovera/scripts/healthcheck.sh"]
      interval: 8s
      timeout: 5s
      retries: 10
      start_period: 25s
    mem_limit: 1500m
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  rviz-bridge:
    profiles: ["legacy-coexistence"]
    image: ${ROVERA_MAPPING_IMAGE:-rovera-robot-edge-mapping-stack}
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 3s
    user: "${ROBOT_UID:-1000}:${ROBOT_GID:-1000}"
    environment:
      HOME: /tmp/rovera-rviz-bridge
      ROS_LOG_DIR: /tmp/rovera-rviz-bridge/ros-log
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Unlike the operational graph, this participant may advertise the
      # whitelisted observation topics to RViz clients on the trusted LAN.
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/rviz_lan_fastdds.xml
    command:
      - ros2
      - run
      - domain_bridge
      - domain_bridge
      - --wait-for-publisher
      - "true"
      - --wait-for-subscription
      - "true"
      - /opt/rovera/config/rviz_domain_bridge.yaml
    volumes:
      - type: bind
        source: ./rviz_lan_fastdds.xml
        target: /etc/rovera/rviz_lan_fastdds.xml
        read_only: true
      - type: bind
        source: ./navigation-stack/config/rviz_domain_bridge.yaml
        target: /opt/rovera/config/rviz_domain_bridge.yaml
        read_only: true
    mem_limit: 192m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
