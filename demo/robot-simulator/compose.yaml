name: rovera-robot-edge

services:
  robot-simulator:
    build:
      context: .
      args:
        ROVERA_EDGE_VERSION: "1.1.0"
        # generic is correct for Raspberry Pi 5. Set rk3588 only on Rockchip.
        MEDIA_PLATFORM: ${MEDIA_PLATFORM:-generic}
    hostname: ${ROBOT_CONTAINER_HOSTNAME:-rovera-robot-edge}
    network_mode: host
    # Keep the edge agent running across Docker/host restarts. The Pulse mount
    # below uses the stable /run/user parent, so Docker never creates a user's
    # /run/user/<uid>/pulse directory before that user logs in.
    restart: unless-stopped
    stop_grace_period: 10s

    env_file:
      - .env
    environment:
      # Đường dẫn ổn định bên trong container. Thư mục host được cấu hình
      # riêng bằng ROBOT_STATE_DIR và không mất khi compose down/up.
      ROBOT_STATE_FILE: /var/lib/rovera/device.json
      # Hardware motion remains opt-in. Enabling the ros2-control profile alone
      # cannot move the car while MOTION_BACKEND keeps its safe default.
      MOTION_BACKEND: ${MOTION_BACKEND:-simulator}
      NAVIGATION_BACKEND: ${NAVIGATION_BACKEND:-simulator}
      MOTION_SOCKET_PATH: /var/lib/rovera/control/motion.sock
      NAVIGATION_SOCKET_PATH: /var/lib/rovera/navigation/navigation.sock
      NAVIGATION_MODE_REQUEST_PATH: /var/lib/rovera/navigation/mode-request.json
      NAVIGATION_MODE_SWITCH_TIMEOUT_SECONDS: ${NAVIGATION_MODE_SWITCH_TIMEOUT_SECONDS:-60}
      MAP_CACHE_DIR: /var/lib/rovera/maps/cache
      MAP_BUNDLE_MAX_BYTES: ${MAP_BUNDLE_MAX_BYTES:-536870912}
      MAP_BUNDLE_MAX_UNCOMPRESSED_BYTES: ${MAP_BUNDLE_MAX_UNCOMPRESSED_BYTES:-1073741824}
      MAP_BUNDLE_MAX_MEMBER_BYTES: ${MAP_BUNDLE_MAX_MEMBER_BYTES:-805306368}
      MAP_BUNDLE_MAX_MEMBERS: ${MAP_BUNDLE_MAX_MEMBERS:-64}
      MAP_BUNDLE_MAX_COMPRESSION_RATIO: ${MAP_BUNDLE_MAX_COMPRESSION_RATIO:-2000}
      MAP_BUNDLE_MAX_IMAGE_PIXELS: ${MAP_BUNDLE_MAX_IMAGE_PIXELS:-100000000}
      MOTION_WATCHDOG_MS: ${MOTION_WATCHDOG_MS:-250}
      STOP_CONFIRMATION_TIMEOUT_SECONDS: ${STOP_CONFIRMATION_TIMEOUT_SECONDS:-3.0}
      STOP_ZERO_DWELL_SECONDS: ${STOP_ZERO_DWELL_SECONDS:-0.25}
      STOP_LINEAR_THRESHOLD: ${STOP_LINEAR_THRESHOLD:-0.015}
      STOP_ANGULAR_THRESHOLD: ${STOP_ANGULAR_THRESHOLD:-0.03}
      # Cho phép FFmpeg/pactl trong container thấy nguồn thu PipeWire/PulseAudio
      # của user trên host (đặc biệt là microphone Bluetooth HSP/HFP).
      PULSE_SERVER: unix:/run/rovera-user/${PULSE_UID:-1000}/pulse/native
      # LiveKit native SDK uses the process trust store for WSS. Reuse the same
      # optional CA file as the Center HTTP/WebSocket client.
      SSL_CERT_FILE: ${CENTER_TLS_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}

    user: "${ROBOT_UID:-1000}:${ROBOT_GID:-1000}"
    group_add:
      - "${VIDEO_GID:-44}"
      - "${AUDIO_GID:-29}"
      # Intel/AMD VA-API and RK3588 DRM buffers use /dev/dri/renderD*.
      - "${RENDER_GID:-110}"

    volumes:
      - type: bind
        source: ${ROBOT_STATE_DIR:-./state}
        target: /var/lib/rovera
      # Keep Python-only edge fixes deployable without rebuilding the media
      # image. These read-only overlays survive future compose recreations.
      - type: bind
        source: ./simulator/client.py
        target: /app/simulator/client.py
        read_only: true
      - type: bind
        source: ./simulator/navigation_backends.py
        target: /app/simulator/navigation_backends.py
        read_only: true
      - type: bind
        source: ./simulator/control_protocol.py
        target: /app/simulator/control_protocol.py
        read_only: true
      - type: bind
        source: ./simulator/motion.py
        target: /app/simulator/motion.py
        read_only: true
      - type: bind
        source: ./simulator/motion_driver.py
        target: /app/simulator/motion_driver.py
        read_only: true
      - type: bind
        source: ./simulator/map_cache.py
        target: /app/simulator/map_cache.py
        read_only: true
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
      - type: bind
        source: ${CENTER_TLS_CA_HOST_FILE:-/etc/ssl/certs/ca-certificates.crt}
        target: ${CENTER_TLS_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
        read_only: true
      # Cho phép Center liệt kê và lựa chọn camera/microphone sau khi robot
      # online mà không cần khai báo trước /dev/videoN trong .env.
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        # /run/user exists from boot. The per-user runtime and Pulse socket can
        # appear later without requiring the container to be recreated.
        source: /run/user
        target: /run/rovera-user
        read_only: true
        bind:
          # Propagate the user's runtime tmpfs when login happens after Docker.
          propagation: rslave
          create_host_path: false

    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 116:* rmw"
      - "c 226:* rmw"
      # Rockchip MPP/RGA are misc devices on vendor kernels. DMA heap normally
      # uses a dynamic high major; 254 covers the Orange Pi 5 BSP images.
      - "c 10:* rmw"
      - "c 254:* rmw"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ros-control-bridge:
    profiles: ["ros2-control", "managed-motion"]
    build:
      context: .
      dockerfile: ros_bridge/Dockerfile
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 5s
    user: "${ROBOT_UID:-1000}:${ROBOT_GID:-1000}"
    environment:
      ROVERA_CONTROL_MODE: ${ROVERA_CONTROL_MODE:-disabled}
      ROVERA_EXCLUSIVE_CMD_VEL_ACK: ${ROVERA_EXCLUSIVE_CMD_VEL_ACK:-}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-20}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/micro_ros_fastdds.xml
      MOTION_SOCKET_PATH: /var/lib/rovera/control/motion.sock
      MOTION_WATCHDOG_MS: ${MOTION_WATCHDOG_MS:-250}
      ROS_COMMAND_RATE_HZ: ${ROS_COMMAND_RATE_HZ:-30}
      ROS_MAX_FORWARD_SPEED: ${ROS_MAX_FORWARD_SPEED:-0.33}
      ROS_MAX_REVERSE_SPEED: ${ROS_MAX_REVERSE_SPEED:-0.25}
      ROS_MAX_ANGULAR_SPEED: ${ROS_MAX_ANGULAR_SPEED:-0.8}
      # Parallel mode leaves the existing Yahboom and micro-ROS containers
      # untouched. The bridge publishes /cmd_vel only while /joy is inactive.
      ROS_USE_TWIST_MUX: ${ROS_USE_TWIST_MUX:-false}
      # With motion-safety enabled no source may write the chassis topic.
      ROS_WEB_CMD_VEL_TOPIC: ${ROS_WEB_CMD_VEL_TOPIC:-/cmd_vel_web}
      ROS_LEGACY_JOY_TOPIC: ${ROS_LEGACY_JOY_TOPIC:-/joy}
      ROS_LEGACY_JOY_STATE_TOPIC: ${ROS_LEGACY_JOY_STATE_TOPIC:-/JoyState}
      ROS_LEGACY_JOY_DEADZONE: ${ROS_LEGACY_JOY_DEADZONE:-0.12}
      ROS_LEGACY_JOY_AXES: ${ROS_LEGACY_JOY_AXES:-1,2}
      ROS_LEGACY_OVERRIDE_MS: ${ROS_LEGACY_OVERRIDE_MS:-350}
      ROS_ESTOP_TOPIC: /safety/estop
      # Chương trình tránh vật cản phát Bool liên tục: true=dừng, false=an toàn.
      # Đặt watchdog > 0 để mất heartbeat cũng khóa chuyển động (fail closed).
      ROS_OBSTACLE_STOP_TOPIC: /rovera/obstacle_stop
      ROS_OBSTACLE_DIRECTIONS_TOPIC: /rovera/obstacle_directions
      ROS_OBSTACLE_WATCHDOG_MS: ${ROS_OBSTACLE_WATCHDOG_MS:-500}
      ROS_SAFETY_CMD_VEL_TOPIC: /cmd_vel_safety
    volumes:
      - type: bind
        source: ${ROBOT_STATE_DIR:-./state}
        target: /var/lib/rovera
      - type: bind
        source: ./micro_ros_fastdds.xml
        target: /etc/rovera/micro_ros_fastdds.xml
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/lib/rovera/control/motion.sock"]
      interval: 5s
      timeout: 2s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  micro-ros-agent:
    # Optional managed replacement. It is deliberately not part of the
    # ros2-control profile used beside an existing legacy stack. Pi thật có
    # thể bật riêng hardware-core mà không khởi động joystick thay thế.
    profiles: ["ros2-managed-stack", "hardware-core"]
    build:
      context: ./micro-ros-agent-guard
    image: rovera-micro-ros-agent-guard:humble
    network_mode: host
    ipc: host
    pid: host
    # Managed ownership must be acknowledged explicitly and never survives a
    # host reboot by default. This prevents a legacy Agent and this service
    # from consuming /dev/ttyUSB0 at the same time.
    restart: "no"
    environment:
      ROVERA_HARDWARE_MODE: managed
      ROVERA_MANAGED_HARDWARE_ACK: ${ROVERA_MANAGED_HARDWARE_ACK:-}
      MICRO_ROS_SERIAL_DEVICE: /dev/ttyUSB0
      ROVERA_SERIAL_LOCK_FILE: /var/lock/rovera-micro-ros/ttyUSB0.lock
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-20}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Level 4 keeps XRCE entity/session handling stable on this MCU without
      # the packet hex dump emitted by level 6.
      MICRO_ROS_AGENT_VERBOSITY: ${MICRO_ROS_AGENT_VERBOSITY:-4}
      # Fast DDS reserves a large virtual address range; an AS limit causes
      # std::bad_alloc even though the Agent RSS is only a few MiB.
      MICRO_ROS_AGENT_VMEM_KB: ${MICRO_ROS_AGENT_VMEM_KB:-0}
      # The Agent and application containers share host networking. Use the
      # UDP-only Fast DDS profile to cross UID boundaries without relying on
      # shared-memory permissions.
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/micro_ros_fastdds.xml
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - /dev/shm:/dev/shm
      - /var/lock/rovera-micro-ros:/var/lock/rovera-micro-ros
      - type: bind
        source: ./micro_ros_fastdds.xml
        target: /etc/rovera/micro_ros_fastdds.xml
        read_only: true
    command: ["serial", "--dev", "/dev/ttyUSB0", "-b", "921600", "-v${MICRO_ROS_AGENT_VERBOSITY:-4}"]
    # A malformed XRCE/DDS sample must restart only the Agent instead of
    # exhausting the Pi. Normal RSS is only a few MiB.
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  yahboom-joystick:
    profiles: ["ros2-managed-stack", "managed-motion"]
    build:
      context: .
      dockerfile: ros_bridge/Dockerfile.yahboom-managed
    image: rovera-yahboom-managed:humble
    network_mode: host
    ipc: host
    restart: unless-stopped
    privileged: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-20}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/micro_ros_fastdds.xml
      # Fast DDS reserves several GiB of virtual address space even while RSS
      # remains modest. Do not cap address space; the independent 900 MiB
      # combined-RSS guard below bounds real Pi memory consumption.
      YAHBOOM_PROCESS_VMEM_KB: ${YAHBOOM_PROCESS_VMEM_KB:-0}
      YAHBOOM_CONTAINER_RSS_KB: ${YAHBOOM_CONTAINER_RSS_KB:-921600}
    volumes:
      - /dev/input:/dev/input
      - type: bind
        source: ./ros_bridge/yahboomcar_joy_web_compatible.launch.py
        target: /opt/rovera/yahboomcar_joy_web_compatible.launch.py
        read_only: true
      - type: bind
        source: ./ros_bridge/yahboom_managed_entrypoint.sh
        target: /opt/rovera/yahboom_managed_entrypoint.sh
        read_only: true
      - type: bind
        source: ./micro_ros_fastdds.xml
        target: /etc/rovera/micro_ros_fastdds.xml
        read_only: true
    command:
      - /bin/bash
      - /opt/rovera/yahboom_managed_entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - test ! -e /tmp/rovera-yahboom-memory-fault && pgrep -f yahboom_joy >/dev/null && pgrep -f robot_state_publisher >/dev/null
      interval: 10s
      timeout: 2s
      retries: 2
    # The vendor bringup has previously grown beyond 3 GiB after a Fast DDS
    # failure. Keep that failure inside this replaceable container.
    mem_limit: 1200m
    memswap_limit: 1200m
    # Fast DDS counts each worker thread against the pids cgroup. The vendor
    # bringup (joy + EKF + TF + robot state) exceeds 128 threads at startup.
    pids_limit: 512
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
