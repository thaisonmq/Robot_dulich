velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.33, 0.0, 0.80]
    min_velocity: [-0.22, 0.0, -0.80]
    max_accel: [0.60, 0.0, 2.00]
    max_decel: [-0.60, 0.0, -2.00]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # Nav2 runs at 10 Hz and can miss one or two cycles while a Pi costmap is
    # serialized. Explicit cancel/safety zero commands remain immediate; this
    # bound only prevents a harmless scheduling gap from braking then surging.
    velocity_timeout: 0.50
