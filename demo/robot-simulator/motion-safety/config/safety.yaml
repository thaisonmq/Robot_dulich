rovera_motion_safety:
  ros__parameters:
    # Chỉ bật/tắt lớp tránh vật cản hình học dùng dữ liệu /scan. Khi tắt,
    # E-stop, cliff/bumper/range, watchdog lệnh và các topic chặn bên ngoài
    # /rovera/obstacle_stop + /rovera/obstacle_directions vẫn hoạt động.
    lidar_obstacle_avoidance_enabled: true
    # Physical source of truth: 0.30 m long x 0.20 m wide. LiDAR self-returns
    # are masked separately and must not be mistaken for chassis width.
    half_length: 0.15
    half_width: 0.10
    # Straight translation uses a 1 cm lateral reserve around the real body.
    # The wider side margin remains exclusive to predicted arcs, so a parallel
    # wall cannot masquerade as an obstacle in front.
    translation_lateral_margin: 0.01
    side_margin: 0.04
    rotation_margin: 0.03
    # URDF laser_joint transform into base_footprint. Safety evaluates every
    # beam in the chassis frame instead of assuming the sensor is at (0, 0).
    laser_x: -0.0046412
    laser_y: 0.0
    laser_yaw: 0.0
    clearance: 0.04
    slow_extra: 0.10
    latency: 0.12
    # Must match velocity_smoother max_decel below.
    braking_acceleration: 0.60
    angular_braking_acceleration: 2.0
    # Minimum preview for a sustained pure rotation; 0.30 rad exposes the
    # long rectangular corner even when instantaneous braking angle is small.
    rotation_preview_angle: 0.30
    trajectory_samples: 6
    scan_timeout: 0.28
    # Applied independently to front/rear/left/right; hard faults retain their
    # own full-chassis instance.
    clear_hysteresis: 0.20
