auto_navigation_speed_profiles:
  default_mode: NORMAL

  # Proven deployment envelope: it is identical to Web Manual Fast and the
  # final shared velocity smoother. Auto profiles are not allowed to exceed it.
  hardware_limits:
    linear_max: 0.33
    reverse_max: 0.22
    angular_max: 0.80
    linear_accel_max: 0.60
    linear_decel_max: 0.60
    angular_accel_max: 2.00
    angular_decel_max: 2.00

  # A new path is aligned once before forward motion. Large error can use the
  # proven Manual Fast ceiling; Rotation Shim and the downstream smoother
  # reduce angular speed as the heading error closes.
  initial_alignment:
    # Rotation Shim uses this as the large-error ceiling and brakes from
    # sqrt(2*a*error) near the target. Pure rotation bypasses the Auto limiter's
    # second slew stage, while the shared 2 rad/s² smoother and motion safety
    # remain downstream exactly as for proven Manual Fast.
    angular_velocity: 0.80
    angular_accel: 2.00

  debug:
    # Keep detailed pipeline evidence during field tuning. Two samples/second
    # are enough to reconstruct a turn without flooding the Pi log.
    enabled: true
    throttle_seconds: 0.5

  profiles:
    slow:
      linear_max: 0.17
      angular_max: 0.60
      linear_accel: 0.30
      linear_decel: 0.45
      angular_accel: 1.20
      angular_decel: 1.50
      regulated_min_radius: 0.70
      regulated_min_speed: 0.08
      # At 0.17 m/s, 0.70 s projected the complete footprint about 12 cm
      # forward and repeatedly intersected isolated 28-30 cm scan cells in a
      # corridor that the unchanged physical motion-safety footprint permits.
      # Keep RPP collision checking enabled, but limit that projection to
      # 8.5 cm so it does not reject the traversable corridor prematurely.
      collision_horizon: 0.50
      # At 0.17 m/s the former velocity-scaled carrot was only ~0.25 m away,
      # causing RPP to chase centimetre-scale map/grid noise left then right.
      # A ~0.41 m carrot damps that noise while collision projection remains on.
      lookahead_dist: 0.55
      min_lookahead_dist: 0.50
      max_lookahead_dist: 0.80
      lookahead_time: 3.20
      replan_frequency: 2.0
      recovery_wait: 1.00
      backup_distance: 0.10
      backup_speed: 0.08

    normal:
      linear_max: 0.27
      angular_max: 0.75
      linear_accel: 0.45
      linear_decel: 0.55
      angular_accel: 1.70
      angular_decel: 1.80
      regulated_min_radius: 0.85
      regulated_min_speed: 0.09
      collision_horizon: 0.90
      lookahead_dist: 0.60
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.90
      lookahead_time: 2.20
      replan_frequency: 2.0
      recovery_wait: 1.00
      backup_distance: 0.12
      backup_speed: 0.10

    fast:
      # FAST deliberately equals, but never exceeds, proven Manual Fast.
      linear_max: 0.33
      angular_max: 0.80
      linear_accel: 0.60
      linear_decel: 0.60
      angular_accel: 2.00
      angular_decel: 2.00
      # FAST keeps 0.33 m/s on straight segments, but starts slowing on broad
      # bends and may fall to 0.10 m/s on a tight bend. The former 0.15 m/s
      # floor carried too much momentum into a correction and caused an S.
      regulated_min_radius: 1.10
      regulated_min_speed: 0.10
      collision_horizon: 1.10
      lookahead_dist: 0.70
      min_lookahead_dist: 0.55
      max_lookahead_dist: 1.00
      lookahead_time: 2.30
      replan_frequency: 2.0
      recovery_wait: 1.00
      backup_distance: 0.15
      backup_speed: 0.12
