amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_navigation
    # Global localization must cover the complete saved map densely enough to
    # avoid collapsing onto a visually similar corridor. Adaptive sampling
    # returns to the lower bound after convergence, so the higher ceiling is
    # paid mainly during an explicit force rescan.
    min_particles: 500
    max_particles: 3000
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 0.3
    # The route may pass people and temporary objects that are absent from the
    # saved map. The probabilistic likelihood-field model can beam-skip those
    # outliers instead of dragging the complete AMCL cloud sideways.
    laser_model_type: likelihood_field_prob
    do_beamskip: true
    beam_skip_distance: 0.50
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90
    max_beams: 90
    laser_max_range: 8.0
    laser_min_range: 0.12
    set_initial_pose: false

rovera_navigation_adapter:
  ros__parameters:
    # Verification preserves an already-good AMCL particle cloud. Global
    # localization is entered only after this bounded evidence check fails.
    localization_confidence_threshold: 0.72
    localization_low_confidence_threshold: 0.30
    localization_low_confidence_grace_seconds: 5.0
    localization_ready_hold_seconds: 1.0
    # Five 2 Hz AMCL samples plus the READY hold must fit before verification
    # escalates to an operator-authorized global rotation.
    localization_verify_timeout_seconds: 5.0
    localization_verify_min_scans: 3
    # Keep a direct AMCL-output freshness gate even while moving, where a
    # stationary pose-spread check is intentionally not applicable.
    localization_amcl_pose_freshness_seconds: 1.5
    # A verified pose with known heading normally passes five fresh stationary
    # AMCL updates plus the evidence hold in under five seconds. If it cannot
    # agree in eight seconds, expose global/assisted localization promptly.
    localization_last_pose_timeout_seconds: 8.0
    # A continuous verified map<-odom anchor is tried first after a rescan.
    # Reject it quickly if strict LiDAR evidence disagrees, then use the click.
    localization_odometry_prior_timeout_seconds: 4.0
    # An operator supplies only a nearby position and AMCL must search every
    # heading. Do not discard a converging local cloud at the shorter timeout
    # used for a persisted pose with a known heading.
    localization_approximate_pose_timeout_seconds: 20.0
    auto_localization_timeout_seconds: 45.0
    global_localization_rotate_delay_seconds: 5.0
    localization_pose_window_size: 8
    localization_pose_minimum_samples: 5
    localization_pose_minimum_duration_seconds: 1.0
    localization_pose_maximum_xy_spread: 0.12
    localization_pose_maximum_median_deviation: 0.06
    localization_pose_maximum_yaw_variance: 0.025
    localization_pose_maximum_yaw_spread: 0.20
    localization_maximum_covariance_xy: 0.50
    localization_maximum_covariance_yaw: 0.50
    # Coarse endpoint agreement finds a viable AMCL hypothesis. Final READY
    # verification below separately constrains the actual endpoint residuals.
    scan_map_score_window_size: 5
    scan_map_maximum_beams: 90
    scan_map_minimum_valid_beams: 25
    scan_map_minimum_score: 0.35
    localization_tracking_scan_map_sanity_score: 0.12
    # A stationary global search has no heading diversity, so require a
    # distinctly strong initial match. During later heading checkpoints the
    # candidate remains on the separate global-final threshold until READY;
    # it must never fall back to the 0.35 local acquisition threshold.
    localization_global_scan_map_minimum_score: 0.75
    localization_global_final_scan_map_minimum_score: 0.70
    # If geometry blocks rotation, resample AMCL inside the same bounded Force
    # Rescan request instead of making the operator press the button 4-5 times.
    localization_stationary_global_retry_seconds: 1.0
    scan_map_minimum_range: 0.20
    scan_map_maximum_range: 6.0
    localization_coarse_match_tolerance: 0.12
    # Require a substantial geometric sample, then judge its real residuals.
    # The deployed 5 cm map produces about 5.1 cm median / 9.6 cm p90 at the
    # stable physical pose. A 11.5 cm p90 budget leaves room for dynamic-beam
    # jitter while remaining below the 12 cm coarse match gate, so the robust
    # percentile is still an effective (not dead) acceptance condition.
    localization_final_minimum_residual_beams: 20
    localization_final_max_median_residual: 0.075
    localization_final_max_p90_residual: 0.115
    # Independent first-hit verification distinguishes neutral near-side
    # occlusion from strong far-side map contradiction. Twenty exact static
    # hits retain a substantial positive-evidence floor. The 20% contradiction
    # cap is stricter than the old 45% undifferentiated mismatch budget while
    # allowing people and movable objects to occlude the remaining beams.
    localization_raycast_maximum_beams: 90
    localization_raycast_minimum_comparable_beams: 25
    localization_raycast_match_tolerance: 0.15
    # Only a continuous wall-like map structure can become strong negative
    # evidence when the live scan sees beyond it. Short map clutter is logged
    # as inconclusive; matching it still counts as positive static evidence.
    localization_raycast_minimum_reliable_structure_span: 0.75
    localization_raycast_minimum_static_matches: 20
    localization_raycast_maximum_contradiction_ratio: 0.20
    # READY tracking is already anchored by AMCL/map->odom continuity. Allow
    # transient endpoint occlusion without weakening the strict 20% initial
    # acquisition cap above or accepting stale AMCL/TF/scan evidence.
    localization_tracking_maximum_contradiction_ratio: 0.40
    # A user-provided nearby hint constrains the search region. Sparse endpoint
    # headings may expose only 12-19 comparable static rays; retain 12 exact
    # hits plus 65% explained rays (static match or nearer dynamic occlusion),
    # strict 20% contradiction, residual/covariance and unique-particle gates.
    # Blind global localization remains at its 0.70 score and 25/20 samples.
    localization_operator_hint_minimum_comparable_beams: 12
    localization_operator_hint_minimum_static_matches: 12
    localization_operator_hint_minimum_scan_score: 0.50
    localization_operator_hint_minimum_explained_ratio: 0.65
    # An explicit click is a local spatial prior. A wider radius admitted the
    # repeated corridor 1.22 m away and let AMCL leave the selected region.
    localization_operator_hint_search_radius: 0.60
    # Acquisition uses a strict 5-of-7 consensus around one pose. Two transient
    # scans may be occluded, while three contradictory/bad frames still reject.
    localization_consensus_window_size: 7
    localization_consensus_required_frames: 5
    localization_consensus_position_tolerance: 0.10
    localization_consensus_yaw_tolerance_degrees: 10.0
    localization_particle_cloud_freshness_seconds: 2.0
    localization_particle_cluster_radius: 0.30
    localization_particle_alternative_separation: 0.75
    localization_particle_minimum_best_weight: 0.55
    localization_particle_minimum_dominance_ratio: 2.0
    # AMCL can resample all particles into a wrong repeated-layout alias. Run
    # one bounded, independent Saved-Map endpoint search before global READY.
    localization_global_scan_maximum_beams: 45
    localization_global_scan_endpoint_tolerance: 0.15
    localization_global_scan_position_step: 0.20
    localization_global_scan_heading_step_degrees: 15.0
    # Hybrid endpoint + expected-range score. Recorded good hint: 0.513;
    # rejected wrong hypothesis: <= 0.404 on the same active map.
    localization_global_scan_minimum_best_score: 0.45
    localization_global_scan_minimum_score_margin: 0.12
    localization_global_scan_minimum_score_ratio: 1.15
    localization_global_scan_candidate_position_tolerance: 0.45
    localization_global_scan_candidate_yaw_tolerance_degrees: 25.0
    localization_global_scan_hint_radius: 1.25
    # Planning scan filtering has different semantics: compare measured range
    # with a map raycast, and never reuse the localization coarse tolerance.
    planning_static_match_tolerance: 0.08
    dynamic_overlay_static_tolerance: 0.08
    dynamic_overlay_ttl_seconds: 2.0
    dynamic_overlay_cluster_distance: 0.12
    # Track a cluster through several local-costmap frames before acting.
    # Moving people keep right-of-way; a stable chair becomes replanable.
    dynamic_obstacle_motion_threshold: 0.12
    dynamic_obstacle_stationary_confirmation_seconds: 1.0
    # Two independent 500 ms velocity windows are required before a rolling
    # costmap cluster may stop the whole mission as a moving object.
    dynamic_obstacle_moving_confirmation_windows: 2
    # Mission-level stop authority requires a confirmed moving track whose
    # predicted footprint meets the driven route inside this TTC horizon.
    dynamic_obstacle_conflict_ttc_seconds: 3.0
    # One fresh return may stop the chassis. Planning/keepout authority needs
    # the same obstacle in six independent costmap frames; motion safety still
    # retains immediate stop authority while this planning evidence matures.
    dynamic_planning_minimum_observations: 6
    dynamic_overlay_max_cells: 600
    # Stop immediately, but spend at most this short evidence window deciding
    # whether the blocker is moving or fixed before planning a real bypass.
    dynamic_obstacle_persistence_seconds: 0.75
    # A controller corridor stop without a repeatedly located obstacle cannot
    # create a safe keepout. Collect evidence for a bounded interval, then
    # expose BLOCKED while preserving the destination instead of waiting and
    # logging forever.
    dynamic_unconfirmed_blocker_timeout_seconds: 8.0
    dynamic_unconfirmed_blocker_log_interval_seconds: 1.0
    # Never leave a preserved destination in an invisible moving-object wait
    # forever. A still-confirmed person becomes an explicit retriable BLOCKED
    # state; a cleared track resumes normally before this bound.
    dynamic_moving_obstacle_max_wait_seconds: 12.0
    # When map/TF disagreement makes most scan endpoints look dynamic, retain
    # raw motion safety but revoke mission-level costmap tracking authority.
    dynamic_tracking_maximum_point_ratio: 0.40
    dynamic_tracking_minimum_static_matches: 20
    dynamic_tracking_evidence_freshness_seconds: 0.75
    # Require sustained route-aligned clearance before resuming. A single
    # sideways scan while waiting must never restart the blocked segment.
    dynamic_obstacle_clear_dwell_seconds: 1.00
    dynamic_replan_retry_seconds: 2.0
    # A route with only pose-noise-sized changes is the same failed route, not
    # a bypass. Require visible lateral displacement before auto-resuming it.
    dynamic_local_bypass_minimum_deviation_m: 0.12
    start_escape_max_distance: 0.60
    turn_bay_max_relocation_distance: 0.80
    # Prefer capture-time TF, wait briefly for normal listener jitter, then
    # accept the nearest transform only inside this explicit age budget.
    scan_tf_wait_seconds: 0.02
    scan_tf_fallback_max_age_seconds: 0.12
    localization_tf_chain_timeout_seconds: 8.0
    scan_map_freshness_seconds: 0.60
    # A go command may land just before the next 1 Hz LiDAR/AMCL evidence
    # callback. Keep all localization gates strict, but wait for that sample.
    navigation_start_localization_evidence_wait_seconds: 1.20
    sensor_time_invalid_grace_seconds: 1.0
    auto_localization_rotation_degrees_per_second: 45.0
    # Hard cap only. Strong candidates normally stop around 75 degrees and
    # ambiguous candidates collect stationary checkpoints across 150 degrees.
    auto_localization_max_angle_degrees: 270.0
    # Wait for the chassis/smoother to stop before collecting the stationary
    # AMCL window used by the strict READY acquisition gate.
    localization_rotation_settle_seconds: 1.0
    # Force Rescan records actual odom headings from basic endpoint/residual
    # quality. Final static/contradiction gates remain separate from collection.
    localization_global_heading_bin_count: 8
    localization_global_strong_min_heading_bins: 2
    localization_global_strong_min_heading_span_degrees: 75.0
    localization_global_min_heading_bins: 4
    localization_global_min_heading_span_degrees: 150.0
    # Pure localization rotation uses the same rectangular corner sweep and
    # explicit margin as final motion-safety. Straight travel can remain valid
    # when this rotation gate is closed.
    localization_rotation_minimum_obstacle_distance: 0.03
    localization_rotation_blocked_timeout_seconds: 5.0
    footprint_half_length: 0.15
    footprint_half_width: 0.10
    # Physical body is 0.30 x 0.20 m. LiDAR self-returns are removed by the
    # scan mask and must not inflate the chassis footprint a second time.
    planning_footprint_padding: 0.0
    corridor_hard_side_margin: 0.02
    # Must match motion-safety's hard straight swept-body envelope. The wider
    # corridor_side_margin below remains comfort/narrow metadata only.
    translation_lateral_margin: 0.01
    # Seven centimetres is the route-ranking comfort target. Hard feasibility
    # is the physical rectangle plus 2 cm, current localization uncertainty,
    # and a map-resolution allowance calculated by the adapter.
    corridor_side_margin: 0.07
    stop_turn_minimum_route_side_clearance: 0.02
    corridor_localization_uncertainty_max: 0.04
    corridor_front_clearance: 0.14
    corridor_lookahead: 1.00
    corridor_confirmation_samples: 5
    corridor_confirmation_duration_seconds: 0.40
    failed_segment_ttl_seconds: 20.0
    failed_segment_radius: 0.12
    failed_segment_forward_offset: 0.45
    failed_segment_max_replans: 3
    alternative_route_max_candidates: 3
    alternative_route_overlap_threshold: 0.85
    alternative_route_keepout_radius: 0.18
    # A global recovery route is visible and cancellable before autonomous
    # execution. If the operator does nothing, the shortest valid route starts.
    dynamic_route_selection_timeout_seconds: 10.0
    # A footprint-valid detour may run automatically only while it remains in
    # the accepted route's local corridor and rejoins it. Anything farther
    # away is a new global route and requires explicit operator selection.
    dynamic_local_bypass_minimum_overlap: 0.35
    dynamic_local_bypass_maximum_deviation_m: 0.50
    # One shared wall-clock budget covers the primary route and all optional
    # alternatives.  Center waits longer than this, so a slow alternative
    # search cannot produce a false command-ACK timeout.
    stop_turn_planning_budget_seconds: 12.0
    # A fresh route-aligned LiDAR obstacle already removes the unsafe direct
    # topology. Keep this replan bounded so the robot does not wait 12--15 s
    # beside the obstacle before presenting the safe route around it.
    stop_turn_live_obstacle_planning_budget_seconds: 6.0
    # A point-selection preview retries once only when the first exact search
    # exhausts its bound.  12s + 15s stays below Center's 30s command timeout.
    stop_turn_retry_planning_budget_seconds: 15.0
    stop_turn_retry_expansion_multiplier: 4
    # Reject corners that work only at one exact localization coordinate.
    # This affects in-place turns only; straight narrow-corridor clearance is
    # still checked with the directional 0.30 x 0.20 m rectangle.
    stop_turn_turn_robustness_radius: 0.01
    # Arrival is position-based. The approach segment already determines a
    # safe chassis heading, so no final in-place orientation adjustment runs.
    stop_turn_require_final_yaw: false
    # Keep final public-goal arrival aligned with Nav2's public goal checker.
    # Internal stop-turn corners retain straight_endpoint_tolerance below.
    stop_turn_final_position_tolerance: 0.12
    stop_turn_max_reanchors_per_segment: 1
    stop_turn_settle_seconds: 0.20
    stop_turn_velocity_settle_timeout_seconds: 0.80
    stop_turn_heading_tolerance_degrees: 3.0
    # Separate completion/re-entry bands plus a stable dwell prevent the
    # TURN_END/TURN_BEGIN chatter seen around one shared threshold.
    stop_turn_heading_reentry_tolerance_degrees: 6.0
    stop_turn_stable_dwell_seconds: 0.40
    stop_turn_reentry_dwell_seconds: 0.20
    # A fresh full-body LiDAR sweep blocks angular output immediately. After
    # one second of continuous blockage, relocate along the current heading
    # instead of repeatedly attempting the same unsafe turn.
    stop_turn_safety_block_timeout_seconds: 1.0
    stop_turn_heading_kp: 1.8
    stop_turn_max_angular_speed: 0.40
    # Ramp pivots inside the stop-turn executor. The downstream smoother still
    # enforces the hardware envelope, but this lower Auto-only slope avoids a
    # zero-to-pivot step at every segment boundary.
    stop_turn_angular_acceleration: 0.80
    # The Pi chassis did not move reliably below ~0.13 rad/s. If wheel odom
    # shows no useful yaw progress for a bounded dwell, apply one effective
    # pivot command; normal braking and every safety gate remain authoritative.
    stop_turn_stall_timeout_seconds: 0.75
    stop_turn_stall_progress_degrees: 0.35
    stop_turn_min_effective_angular_speed: 0.18
    stop_turn_rate_window_seconds: 0.10
    # Brake a pivot before the settle band so smoother/chassis momentum does
    # not carry it past the target and cause a reverse correction.
    stop_turn_angular_deceleration: 1.20
    stop_turn_angular_reaction_seconds: 0.30
    straight_max_angular_correction: 0.18
    straight_path_pose_spacing: 0.05
    execution_pose_freshness_seconds: 0.30
    execution_pose_max_translation_residual_m: 0.12
    execution_pose_max_yaw_residual_degrees: 20.0
    execution_pose_discontinuity_confirmation_seconds: 0.15
    straight_heading_kp: 1.2
    straight_cross_track_kp: 1.0
    straight_heading_deadband_degrees: 1.0
    straight_cross_track_deadband: 0.01
    # Four times the existing 3 degree turn completion tolerance. Above this
    # bounded correction region forward motion is forbidden and re-anchor is
    # required. The lateral limit is at least one 5 cm map cell plus margin.
    straight_hard_heading_error_degrees: 12.0
    straight_hard_cross_track: 0.08
    straight_endpoint_tolerance: 0.03
    straight_overshoot_epsilon: 0.005
    straight_endpoint_reaction_time_seconds: 0.15
    segment_watchdog_settle_allowance_seconds: 2.0
    segment_watchdog_time_factor: 3.0
    segment_watchdog_travel_factor: 2.0
    segment_watchdog_travel_slack: 0.30

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /opt/rovera/config/bootstrap-map.yaml

planner_server:
  ros__parameters:
    # Diagnostic overrun threshold only. The generated BT computes once and
    # again only after controller/recovery failure; no timer drives replanning.
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased, ThetaDiagnostic]
    GridBased:
      # Execution-authority lattice: forward straight translation and pure
      # in-place rotation only. The adapter additionally validates every
      # rectangular translation and complete corner rotation sweep.
      plugin: nav2_smac_planner/SmacPlannerLattice
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 250000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      lattice_filepath: /opt/rovera/control_sets/rovera_5cm_24_heading_stop_turn.json
      analytic_expansion_ratio: -1.0
      analytic_expansion_max_length: 0.0
      allow_reverse_expansion: false
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 3.0
      rotation_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smooth_path: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2
    # Theta* remains available only for diagnostics/comparison. Its polyline
    # is never previewed or executed without stop-turn canonicalization and
    # exact swept-footprint validation.
    ThetaDiagnostic:
      plugin: nav2_theta_star_planner/ThetaStarPlanner
      how_many_corners: 8
      allow_unknown: false
      w_euc_cost: 1.0
      w_traversal_cost: 0.02
      use_final_approach_orientation: false

controller_server:
  ros__parameters:
    # The deployed Pi also misses 15 Hz deadlines under normal media + AMCL
    # load. Ten deterministic updates per second move only 1.7 cm at SLOW and
    # 3.3 cm at FAST; the downstream smoother and safety loops remain faster.
    controller_frequency: 10.0
    # Controller Server otherwise subscribes to its default /odom topic. This
    # deployment has no /odom publisher; EKF owns the canonical velocity on
    # /odometry/filtered. Without it, Humble RPP sees angular speed as zero on
    # every cycle and repeatedly clamps a requested 0.8 rad/s turn to the
    # first acceleration step (2.0 / 20 Hz = 0.1 rad/s).
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # A persistent controller failure now triggers the bounded recovery tree,
    # whose next attempt computes a fresh path instead of timer replanning.
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker, segment_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # This checker measures translation only. A worst-case initial 180-degree
      # alignment at 0.55 rad/s legitimately takes over six seconds, so the old
      # five-second allowance aborted a healthy turn and restarted the path.
      required_movement_radius: 0.06
      movement_time_allowance: 12.0
    goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.18
    segment_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # Internal turn points use a tight XY bound because the exact rotation
      # sweep is validated around that point. The final public destination may
      # retain the ordinary checker above for UI semantics.
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.08
    FollowPath:
      # The adapter owns every in-place turn and sends one densely sampled,
      # collinear segment at a time. Dense samples prevent Humble RPP from
      # pruning a two-pose path back to the start pose behind the robot.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      rotate_to_heading_angular_vel: 0.80
      max_angular_accel: 2.00
      # NORMAL startup values. The adapter applies the selected SLOW/NORMAL/
      # FAST profile atomically at runtime and keeps this controller, behavior
      # server and the Auto-only pre-mux limiter synchronized.
      desired_linear_vel: 0.27
      lookahead_dist: 0.60
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.90
      lookahead_time: 2.20
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.35
      # RPP predicts collision on its own curved carrot trajectory, but the
      # adapter deliberately discards that curvature and executes a fixed-
      # heading straight segment. On the Pi this rejected a 0.915 m clear
      # corridor because an off-axis scan cell intersected the unused arc.
      # Collision authority for the trajectory actually sent to the wheels is
      # retained by the exact global footprint validator, live corridor gate
      # and downstream raw-LiDAR motion-safety node.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.90
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.85
      regulated_linear_scaling_min_speed: 0.09
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.18
      cost_scaling_gain: 0.80
      inflation_cost_scaling_factor: 3.0
      # Rotation is exclusively the adapter's TURN phase. RPP may follow the
      # current isolated line forward or reverse; the adapter owns the signed
      # direction and keeps the chassis on one fixed heading.
      use_rotate_to_heading: false
      allow_reversing: true
      # RPP sees no internal corner. While straight, the adapter additionally
      # clamps angular correction so wheel/odometry drift cannot become an arc.
      rotate_to_heading_min_angle: 0.10
      # RPP uses angular error plus this acceleration bound to run fast over
      # the large part of a turn and brake only near the requested heading.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      # The controller still updates its private grid at 10 Hz. Publishing the
      # full grid at 3 Hz is enough for the Python tracker and avoids starving
      # the 10 Hz controller/velocity pipeline on the Pi.
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      # A 2.5 cm rolling grid avoids a full 5 cm aliasing error when a scan
      # endpoint lands on different cells in the global and local grids.
      resolution: 0.025
      # Physical body; explicit safety margins are applied separately.
      footprint: "[[0.15, 0.10], [0.15, -0.10], [-0.15, -0.10], [-0.15, 0.10]]"
      footprint_padding: 0.0
      # The robot has a planar LaserScan, not a 3D point cloud. Use the same
      # 2D obstacle model as the global costmap so the planner and RPP do not
      # disagree about which cells are lethal.
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan_navigation
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 4.0
          raytrace_min_range: 0.12
          obstacle_max_range: 3.5
          obstacle_min_range: 0.12
          # Do not smear several noisy scan endpoints into a thick artificial
          # wall around a stationary robot. The sensor is ~12.7 Hz and this
          # costmap updates at 10 Hz, so every cycle already receives a scan.
          observation_persistence: 0.0
          # The LiDAR averages ~12.7 Hz but can jitter above 200 ms on Pi 5.
          # Keep the costmap itself at 10 Hz; this field is only the stale-data
          # warning/watchdog threshold, so 0.30 s avoids log/CPU storms without
          # delaying obstacle insertion.
          expected_update_rate: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.18
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      # Same physical 0.30 x 0.20 m body as local costmap and safety.
      footprint: "[[0.15, 0.10], [0.15, -0.10], [-0.15, -0.10], [-0.15, 0.10]]"
      footprint_padding: 0.0
      plugins: [static_layer, failed_segment_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        # A saved 5 cm map can overlap the localized pose by one or two cells.
        # The robot is already physically occupying this polygon, so clear the
        # static layer only under its current measured footprint. The scan
        # obstacle layer, inflation, RPP collision check and motion-safety stay
        # active; this only prevents Theta* rejecting a valid starting cell.
        footprint_clearing_enabled: true
      failed_segment_layer:
        plugin: nav2_costmap_2d::StaticLayer
        # Confirmed blocked segments live in a separate full-map mask. When
        # their TTL expires the adapter publishes an empty mask, removing only
        # recovery keepouts without clearing saved walls or live obstacles.
        map_topic: /navigation/failed_segment_mask
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        # This layer carries the complete Saved Map plus temporary exclusions,
        # so it is the final static planning authority before live obstacles.
        # Overwrite prevents a stale primary StaticLayer merge from disagreeing
        # with the artifact used by executable-path validation.
        use_maximum: false
        trinary_costmap: true
        lethal_cost_threshold: 65
        unknown_cost_value: -1
        footprint_clearing_enabled: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Merge live endpoints with the saved map. Overwriting the static
        # layer made small AMCL/scan alignment errors carve openings through
        # mapped walls: the global planner then chose those openings while the
        # local controller still saw a collision and refused to move.
        combination_method: 1
        observation_sources: scan
        scan:
          # Saved-wall endpoints are masked only on this planning-only topic.
          # AMCL, local costmap and motion safety continue to receive the full
          # /scan_navigation or raw /scan streams.
          topic: /scan_planning
          clearing: true
          marking: true
          data_type: LaserScan
          # Masked static endpoints become +inf so they still clear stale
          # dynamic cells without being marked a second time.
          inf_is_valid: true
          raytrace_max_range: 4.0
          raytrace_min_range: 0.12
          obstacle_max_range: 3.5
          obstacle_min_range: 0.12
          # One current scan is enough at 12.7 Hz. Persisting old endpoints
          # thickened both sides of a narrow corridor after small AMCL shifts.
          observation_persistence: 0.0
          expected_update_rate: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # A centered 0.20 m robot remains outside inflation in a 0.40 m
        # corridor; explicit Auto classification still requires its margins.
        cost_scaling_factor: 3.0
        inflation_radius: 0.18
      # The adapter validates a complete generation, not partial update tiles.
      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    # Humble defaults to only 20 ms for an action acknowledgement. The Pi
    # exceeded that during normal load and entered recovery although the
    # planner was healthy. This is milliseconds, not planning-result timeout.
    default_server_timeout: 500
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 20
    # The launch file supplies the generated NORMAL tree here. Each goal also
    # carries the selected profile's generated custom tree, so no restart is
    # needed when the operator changes speed mode.
    always_reload_bt_xml: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.1
    # Recovery Spin is also pure Auto rotation. Use the same proven limit and
    # acceleration as Manual Fast/RPP; twist_mux, smoother and motion-safety
    # remain downstream and unchanged.
    max_rotational_vel: 0.80
    min_rotational_vel: 0.20
    rotational_acc_lim: 2.00

waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: true
