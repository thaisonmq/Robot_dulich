amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_navigation
    min_particles: 300
    max_particles: 1200
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 0.3
    laser_model_type: likelihood_field
    laser_max_range: 8.0
    laser_min_range: 0.12
    set_initial_pose: false

rovera_navigation_adapter:
  ros__parameters:
    # Verification preserves an already-good AMCL particle cloud. Global
    # localization is entered only after this bounded evidence check fails.
    localization_confidence_threshold: 0.72
    localization_low_confidence_threshold: 0.30
    localization_low_confidence_grace_seconds: 5.0
    localization_ready_hold_seconds: 2.0
    localization_verify_timeout_seconds: 3.0
    localization_verify_min_scans: 3
    # A verified pose with known heading normally passes five fresh stationary
    # AMCL updates plus the evidence hold in under five seconds. If it cannot
    # agree in eight seconds, expose global/assisted localization promptly.
    localization_last_pose_timeout_seconds: 8.0
    # An operator supplies only a nearby position and AMCL must search every
    # heading. Do not discard a converging local cloud at the shorter timeout
    # used for a persisted pose with a known heading.
    localization_approximate_pose_timeout_seconds: 20.0
    auto_localization_timeout_seconds: 45.0
    global_localization_rotate_delay_seconds: 5.0
    localization_pose_window_size: 8
    localization_pose_minimum_samples: 5
    localization_pose_minimum_duration_seconds: 1.0
    localization_pose_maximum_xy_spread: 0.12
    localization_pose_maximum_median_deviation: 0.06
    localization_pose_maximum_yaw_variance: 0.025
    localization_pose_maximum_yaw_spread: 0.20
    # 90 beams bounds CPU. A 12 cm endpoint tolerance is 2.4 cells on the
    # deployed 5 cm map and accommodates measured scan/map quantization. This
    # is one evidence gate; the multi-heading global-search gate handles map
    # ambiguity instead of pretending endpoint score alone proves uniqueness.
    scan_map_score_window_size: 5
    scan_map_maximum_beams: 90
    scan_map_minimum_valid_beams: 25
    scan_map_minimum_score: 0.35
    scan_map_minimum_range: 0.20
    scan_map_maximum_range: 6.0
    scan_map_endpoint_tolerance: 0.12
    scan_map_freshness_seconds: 0.60
    sensor_time_invalid_grace_seconds: 1.0
    auto_localization_rotation_degrees_per_second: 20.0
    auto_localization_max_angle_degrees: 270.0
    # A global particle search must observe at least two meaningfully
    # different headings before an otherwise ambiguous static scan is trusted.
    localization_global_minimum_rotation_degrees: 30.0
    # Clearance beyond the complete swept circle of the 0.30 x 0.10 m body,
    # not distance from its current axis-aligned rectangle.
    localization_rotation_minimum_obstacle_distance: 0.08
    footprint_half_length: 0.20
    footprint_half_width: 0.18

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /opt/rovera/config/bootstrap-map.yaml

planner_server:
  ros__parameters:
    # This is the warning threshold; the generated custom BT below is what
    # actually requests a new global plan at 2 Hz.
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      # The 2D planner only validated the path's center cells. In the narrow
      # gap beside an obstacle it could therefore return a line that looked
      # free on the map while the rectangular footprint was already in
      # collision in the controller costmap. State Lattice search validates
      # the complete oriented footprint and its differential-drive primitive
      # set supports fast in-place heading changes without car-like loops.
      plugin: nav2_smac_planner/SmacPlannerLattice
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 250000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      lattice_filepath: /opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 1.5
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 3.0
      rotation_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Keep the controller alive across several 2 Hz replans. At 0.5 s it
    # aborted on the same tick that the first detour arrived, causing a
    # clear/recovery loop instead of following the new path.
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # Give periodic replanning enough time to route around a temporary
      # obstacle before escalating to the bounded Nav2 recovery sequence.
      required_movement_radius: 0.08
      movement_time_allowance: 10.0
    goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.18
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # NORMAL startup values. The adapter applies the selected SLOW/NORMAL/
      # FAST profile atomically at runtime and keeps this controller, behavior
      # server and the Auto-only pre-mux limiter synchronized.
      desired_linear_vel: 0.27
      lookahead_dist: 0.50
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.75
      lookahead_time: 1.60
      rotate_to_heading_angular_vel: 0.75
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.90
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.12
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.40
      cost_scaling_gain: 0.80
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      allow_reversing: false
      # Align first for heading errors above ~20 degrees. The former 45 degree
      # threshold made RPP drive a broad S-curve even when the selected route
      # itself was straight.
      rotate_to_heading_min_angle: 0.35
      # RPP uses angular error plus this acceleration bound to run fast over
      # the large part of a turn and brake only near the requested heading.
      max_angular_accel: 1.70

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      # A 2.5 cm rolling grid avoids a full 5 cm aliasing error when a scan
      # endpoint lands on different cells in the global and local grids.
      resolution: 0.025
      footprint: "[[0.20, 0.18], [0.20, -0.18], [-0.20, -0.18], [-0.20, 0.18]]"
      # The polygon is the physical body envelope. Keeping padding at zero is
      # deliberate: a finer 2.5 cm grid below handles scan quantization, while
      # inflation and motion-safety retain the approach/stop reserve.
      footprint_padding: 0.0
      # The robot has a planar LaserScan, not a 3D point cloud. Use the same
      # 2D obstacle model as the global costmap so the planner and RPP do not
      # disagree about which cells are lethal.
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan_navigation
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 4.0
          raytrace_min_range: 0.12
          obstacle_max_range: 3.5
          obstacle_min_range: 0.12
          # Do not smear several noisy scan endpoints into a thick artificial
          # wall around a stationary robot. The sensor is ~12.7 Hz and this
          # costmap updates at 10 Hz, so every cycle already receives a scan.
          observation_persistence: 0.0
          # The LiDAR averages ~12.7 Hz but can jitter above 200 ms on Pi 5.
          # Keep the costmap itself at 10 Hz; this field is only the stale-data
          # warning/watchdog threshold, so 0.30 s avoids log/CPU storms without
          # delaying obstacle insertion.
          expected_update_rate: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.20, 0.18], [0.20, -0.18], [-0.20, -0.18], [-0.20, 0.18]]"
      # The polygon is already the measured chassis outline. One centimetre
      # provides a planning reserve without classifying a nearby but external
      # obstacle as part of the robot's start footprint; the finer local grid
      # below removes the controller-side endpoint aliasing.
      footprint_padding: 0.01
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Merge live endpoints with the saved map. Overwriting the static
        # layer made small AMCL/scan alignment errors carve openings through
        # mapped walls: the global planner then chose those openings while the
        # local controller still saw a collision and refused to move.
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan_navigation
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 4.0
          raytrace_min_range: 0.12
          obstacle_max_range: 3.5
          obstacle_min_range: 0.12
          observation_persistence: 0.35
          expected_update_rate: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Maintain a broad cost gradient so the cost-aware planner prefers
        # open corridors and routes around dynamic obstacles when possible.
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 20
    default_server_timeout: 20
    # The launch file supplies the generated NORMAL tree here. Each goal also
    # carries the selected profile's generated custom tree, so no restart is
    # needed when the operator changes speed mode.
    always_reload_bt_xml: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 1.1
    max_rotational_vel: 0.75
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.70

waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: true
