name: rovera-robot-legacy-hardware

services:
  legacy-micro-ros-agent:
    build:
      context: ./micro-ros-agent-guard
    image: rovera-micro-ros-agent-guard:humble
    network_mode: host
    ipc: host
    pid: host
    restart: unless-stopped
    privileged: true
    environment:
      ROVERA_HARDWARE_MODE: legacy
      MICRO_ROS_SERIAL_DEVICE: /dev/ttyUSB0
      ROVERA_SERIAL_LOCK_FILE: /var/lock/rovera-micro-ros/ttyUSB0.lock
      # The vendor runtime uses domain 20. Leaving this unset silently puts
      # MCU topics in domain 0, where the Web/bringup graph cannot see them.
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-20}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/micro_ros_fastdds.xml
      MICRO_ROS_AGENT_VERBOSITY: ${MICRO_ROS_AGENT_VERBOSITY:-2}
      # Fast DDS reserves a large virtual address range; an AS limit causes
      # std::bad_alloc even though the Agent RSS is only a few MiB.
      MICRO_ROS_AGENT_VMEM_KB: ${MICRO_ROS_AGENT_VMEM_KB:-0}
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /var/lock/rovera-micro-ros:/var/lock/rovera-micro-ros
      - type: bind
        source: ./micro_ros_fastdds.xml
        target: /etc/rovera/micro_ros_fastdds.xml
        read_only: true
    command: ["serial", "--dev", "/dev/ttyUSB0", "-b", "921600", "-v${MICRO_ROS_AGENT_VERBOSITY:-2}"]
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
