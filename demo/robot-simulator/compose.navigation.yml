name: rovera-robot-navigation

services:
  motion-safety:
    profiles: ["safety", "navigation", "managed-motion"]
    build:
      context: ./motion-safety
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 3s
    user: "${ROBOT_UID:-1000}:${ROBOT_GID:-1000}"
    environment:
      HOME: /tmp/rovera-safety
      ROS_LOG_DIR: /tmp/rovera-safety/ros-log
      ROVERA_CMD_VEL_MODE: ${ROVERA_CMD_VEL_MODE:-}
      ROVERA_EXCLUSIVE_CMD_VEL_ACK: ${ROVERA_EXCLUSIVE_CMD_VEL_ACK:-}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-20}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/micro_ros_fastdds.xml
      NAVIGATION_DEBUG_LOG: "${NAVIGATION_DEBUG_LOG:-true}"
    volumes:
      # Mount cấu hình từ project để đổi chế độ/tốc độ chỉ cần recreate riêng
      # motion-safety, không phải build lại image và không đụng USB Agent.
      - type: bind
        source: ./motion-safety/config/safety.yaml
        target: /opt/rovera/config/safety.yaml
        read_only: true
      - type: bind
        source: ./motion-safety/config/velocity_smoother.yaml
        target: /opt/rovera/config/velocity_smoother.yaml
        read_only: true
      - type: bind
        source: ./micro_ros_fastdds.xml
        target: /etc/rovera/micro_ros_fastdds.xml
        read_only: true
    healthcheck:
      # CMD-SHELL uses /bin/sh (which has no `source`). Avoid spawning a DDS
      # probe every five seconds; verify the actual safety node process that
      # ros2 launch supervises instead.
      test: ["CMD-SHELL", "grep -a -q '/rovera_motion_safety/safety_node' /proc/[0-9]*/cmdline 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 12s
    mem_limit: 384m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  navigation-stack:
    profiles: ["navigation"]
    build:
      context: ./navigation-stack
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 10s
    # Run with the same uid/gid as the edge agent so map bundles, autosaves and
    # upload markers stay writable by both services on the shared state bind.
    user: "${ROBOT_UID:-1000}:${ROBOT_GID:-1000}"
    environment:
      HOME: /tmp/rovera-navigation
      ROS_LOG_DIR: /tmp/rovera-navigation/ros-log
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-20}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rovera/micro_ros_fastdds.xml
      ROBOT_ID: ${ROBOT_ID:-ROBOT-001}
      NAVIGATION_MODE: ${NAVIGATION_MODE:-NAVIGATION}
      ROVERA_USE_VENDOR_BASE_RUNTIME: ${ROVERA_USE_VENDOR_BASE_RUNTIME:-0}
      NAVIGATION_SOCKET_PATH: /var/lib/rovera/navigation/navigation.sock
      NAVIGATION_SOCKET_GID: ${ROBOT_GID:-1000}
      AUTO_NAVIGATION_SPEED_PROFILES_PATH: /opt/rovera/config/auto_navigation_speed_profiles.yaml
      AUTO_NAVIGATION_SPEED_MODE_PATH: /var/lib/rovera/navigation/auto-speed-mode.json
      AUTO_NAVIGATION_BT_DIRECTORY: /var/lib/rovera/navigation/behavior_trees
      ROVERA_MAP_ROOT: /var/lib/rovera/maps
      NAV2_MAP_YAML: ${NAV2_MAP_YAML:-/opt/rovera/config/bootstrap-map.yaml}
      REQUIRE_SENSOR_HEALTH: ${REQUIRE_SENSOR_HEALTH:-1}
      NAVIGATION_DEBUG_LOG: "${NAVIGATION_DEBUG_LOG:-true}"
      NAVIGATION_DEBUG_LOG_PATH: ${NAVIGATION_DEBUG_LOG_PATH:-/var/lib/rovera/navigation/logs/navigation-debug.log}
    volumes:
      - type: bind
        source: ${ROBOT_STATE_DIR:-./state}
        target: /var/lib/rovera
      # The adapter is pure Python. Overlay the deployed source so mode
      # switches keep fixes without rebuilding the ROS/Nav2 base image.
      - type: bind
        source: ./navigation-stack/adapter_node.py
        target: /ws/install/rovera_navigation_adapter/lib/python3.10/site-packages/adapter_node.py
        read_only: true
      - type: bind
        source: ./navigation-stack/navigation_core.py
        target: /ws/install/rovera_navigation_adapter/lib/python3.10/site-packages/navigation_core.py
        read_only: true
      - type: bind
        source: ./navigation-stack/sensor_normalizer.py
        target: /ws/install/rovera_navigation_adapter/lib/python3.10/site-packages/sensor_normalizer.py
        read_only: true
      - type: bind
        source: ./navigation-stack/speed_profiles.py
        target: /ws/install/rovera_navigation_adapter/lib/python3.10/site-packages/speed_profiles.py
        read_only: true
      - type: bind
        source: ./navigation-stack/config/nav2_params.yaml
        target: /opt/rovera/config/nav2_params.yaml
        read_only: true
      - type: bind
        source: ./navigation-stack/config/robot.urdf
        target: /opt/rovera/config/robot.urdf
        read_only: true
      - type: bind
        source: ./navigation-stack/config/ekf.yaml
        target: /opt/rovera/config/ekf.yaml
        read_only: true
      - type: bind
        source: ./navigation-stack/config/sensor_time.yaml
        target: /opt/rovera/config/sensor_time.yaml
        read_only: true
      - type: bind
        source: ./navigation-stack/launch/navigation_stack.launch.py
        target: /opt/rovera/launch/navigation_stack.launch.py
        read_only: true
      - type: bind
        source: ./navigation-stack/config/auto_navigation_speed_profiles.yaml
        target: /opt/rovera/config/auto_navigation_speed_profiles.yaml
        read_only: true
      - type: bind
        source: ./micro_ros_fastdds.xml
        target: /etc/rovera/micro_ros_fastdds.xml
        read_only: true
    depends_on:
      motion-safety:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/rovera/scripts/healthcheck.sh"]
      interval: 8s
      timeout: 5s
      retries: 10
      start_period: 25s
    mem_limit: 1800m
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
