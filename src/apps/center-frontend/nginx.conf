map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:ROVERA_TLS:10m;
  ssl_session_timeout 1d;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://center-backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Saving/loading a SLAM pose-graph on the Pi can exceed nginx's default
    # 60-second upstream timeout while the backend is still waiting for ACK.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
  location = /health {
    proxy_pass http://center-backend:8000/health;
  }
  location = /openapi.json {
    proxy_pass http://center-backend:8000/openapi.json;
  }
  location /docs {
    proxy_pass http://center-backend:8000;
  }
  location /redoc {
    proxy_pass http://center-backend:8000;
  }
  # React routes must survive a direct URL/open/refresh. Multi-segment paths
  # below /maps remain backend-hosted static map artifacts.
  location = /maps {
    try_files $uri /index.html;
  }
  location = /maps/ {
    try_files $uri /index.html;
  }
  location = /maps/create {
    try_files $uri /index.html;
  }
  location ~ ^/maps/[^/]+/?$ {
    try_files $uri /index.html;
  }
  location /maps/ {
    proxy_pass http://center-backend:8000;
  }
  location /ws/ {
    proxy_pass http://center-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location ^~ /rtc {
    proxy_pass http://livekit:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
  location / {
    # Ứng dụng nội bộ được cập nhật thường xuyên; luôn kiểm tra lại bundle
    # để máy vận hành không tiếp tục chạy phiên bản SPA cũ sau khi deploy.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri /index.html;
  }
}
