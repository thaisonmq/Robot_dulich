server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://center-backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health {
    proxy_pass http://center-backend:8000/health;
  }
  location = /openapi.json {
    proxy_pass http://center-backend:8000/openapi.json;
  }
  location /docs {
    proxy_pass http://center-backend:8000;
  }
  location /redoc {
    proxy_pass http://center-backend:8000;
  }
  location /maps/ {
    proxy_pass http://center-backend:8000;
  }
  location /ws/ {
    proxy_pass http://center-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
  location / {
    # Ứng dụng nội bộ được cập nhật thường xuyên; luôn kiểm tra lại bundle
    # để máy vận hành không tiếp tục chạy phiên bản SPA cũ sau khi deploy.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri /index.html;
  }
}
